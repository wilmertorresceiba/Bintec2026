<form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
  <div class="campo">
    <label for="correo">Correo electrónico</label>
    <input
      id="correo"
      type="email"
      formControlName="correo"
      autocomplete="username"
      placeholder="nombre@correo.com"
      appValidar
    />
  </div>

  <div class="campo">
    <label for="clave">Clave</label>
    <div class="login__clave">
      <input
        id="clave"
        [type]="mostrarClave() ? 'text' : 'password'"
        formControlName="clave"
        autocomplete="current-password"
        placeholder="Mínimo 8 caracteres"
        appValidar
      />
      <button
        type="button"
        class="login__ver-clave"
        [attr.aria-pressed]="mostrarClave()"
        [attr.aria-label]="mostrarClave() ? 'Ocultar clave' : 'Mostrar clave'"
        (click)="alternarClave()"
      >
        <svg
          class="login__icono"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          @if (mostrarClave()) {
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
            <path
              d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
            />
            <path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
            <line x1="2" y1="2" x2="22" y2="22" />
          } @else {
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          }
        </svg>
      </button>
    </div>
  </div>

  <p class="login__error" role="alert">{{ error() }}</p>

  <button
    type="submit"
    class="btn btn-primario login__enviar"
    [disabled]="cargando()"
    [attr.aria-busy]="cargando()"
  >
    {{ cargando() ? 'Validando tus datos…' : 'Continuar' }}
  </button>

  <button type="button" class="login__enlace" (click)="usarCredencialesDemo()">
    Autocompletar credenciales
  </button>
</form>
